#
# Build and publish the CI base image.
#
# The image is the build+test ENVIRONMENT for every cor* repo. It contains no
# source of ours, which is why this workflow needs no cross-repo credentials -
# it is the one piece of CI that can run before any of that exists.
#
# Triggers are PATH-FILTERED on purpose. The image takes minutes to build
# (mongo-c and libmicrohttpd are compiled from source, which is the whole
# reason it exists), and rebuilding it on every commit to the umbrella would
# cost that on changes that cannot possibly affect it.
#
# A pull request BUILDS but does not publish: proof the image is still
# buildable, without moving the tag everyone else depends on. Everything else
# publishes.
#
# The gate is written as "not a pull request" rather than "is a push". Naming
# the one event that publishes silently excludes the others - a manual
# workflow_dispatch then builds, skips the push, and reports SUCCESS having
# published nothing. Which is exactly what happened the first time.
#
name: CI base image

on:
  pull_request:
    paths:
      - docker/Dockerfile.ci
      - docker/Dockerfile.ci-nightly
      - .github/workflows/baseimage.yml
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.ci
      - docker/Dockerfile.ci-nightly
      - .github/workflows/baseimage.yml
  workflow_dispatch:

env:
  IMAGE_NAME: coraine-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #
      # ONE tag, immutable: <yyyy-mm-dd>-<sha>.
      #
      # There is deliberately no "latest". A base image that moves under a build
      # is a green run that proves nothing about the next one - and a consumer
      # that CAN follow a moving tag eventually will, so the tag does not exist.
      # Adopting a new image is a one-line change in the consumer: reviewable,
      # and bisectable, because the run that first used an image is a commit.
      #
      - name: Compute tags
        id: tags
        run: |
          echo "date_sha=$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      #
      # push: false on a pull request. The build still runs in full, so a
      # broken Dockerfile fails the PR - it just does not publish.
      #
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: quay.io/seamware/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.date_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #
      # The nightly image is FROM the one just built, so it must come after - and
      # it is only worth building when the base was actually published, since it
      # pulls it by tag.
      #
      - name: Build and push the nightly image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ci-nightly
          push: true
          build-args: BASE_TAG=${{ steps.tags.outputs.date_sha }}
          tags: quay.io/seamware/${{ env.IMAGE_NAME }}-nightly:${{ steps.tags.outputs.date_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #
      # The Dockerfile's last layer already asserts the environment is complete.
      # This repeats it against the built image so the check also covers a
      # cached build, where that layer may not have re-run.
      #
      - name: Verify the image can build and test
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm quay.io/seamware/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.date_sha }} \
            bash -c 'set -eux;
              pkg-config --modversion mongoc2;
              pkg-config --modversion libmicrohttpd;
              for c in cmake gcc git curl jq python3 psql mongosh mosquitto pkill killall; do
                command -v "$c" >/dev/null || { echo "MISSING $c"; exit 1; };
              done'

      - name: Summary
        if: always()
        run: |
          {
            echo "### CI base image"
            echo
            if [ "${{ github.event_name }}" != pull_request ]; then
              echo "Published:"
              echo "- \`quay.io/seamware/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.date_sha }}\`"
              echo "- \`quay.io/seamware/${{ env.IMAGE_NAME }}-nightly:${{ steps.tags.outputs.date_sha }}\`"
              echo
              echo "To adopt, in coraine: set the image tag in .github/workflows/{ci,nightly}.yml to \`${{ steps.tags.outputs.date_sha }}\`"
            else
              echo "Built only — pull requests do not publish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
